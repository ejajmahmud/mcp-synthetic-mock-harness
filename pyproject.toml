[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-synthetic-mock-harness"
version = "0.1.0"
description = "Deterministic tool mocking, call recording, and replay harness for automated unit testing of MCP agents without external servers"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
mcp-synthetic-mock-harness = "mcp_synthetic_mock_harness.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_synthetic_mock_harness*"]
